name: Publish & Deploy

on:
  push:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Run publish & deploy
        env:
          GH_REF: ${{ github.ref }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "## Run publish & deploy (${GH_REF}) (${GH_EVENT_NAME})"
          export NPM_TOKEN="${{ secrets.NPM_TOKEN }}"
          cat << 'EOF' >> .yarnrc.yml
          npmScopes:
            gdacm:
              npmAlwaysAuth: true
              npmAuthToken: "${NPM_TOKEN:-}"
          EOF
          yarn install --immutable
          yarn build
          mkdir -p local
          cat << EOF > local/gra.json
          {
            "influxdbUid": "${{ secrets.INFLUXDBUID }}",
            "jsonDsUid": "${{ secrets.JSONDSUID }}"
          }
          EOF
          if [[ "${GH_REF}" == refs/tags/* ]]; then
            export GDM_TEST_NAME="t-${GH_REF_NAME}"
          else
            if [ "${GH_REF_NAME}" != "main" ]; then
              export GDM_TEST_NAME="b-${GH_REF_NAME}"
            fi
          fi
          echo "GDM_TEST_NAME=${GDM_TEST_NAME}"
          GDM_API_URL="${{ vars.HOST_GRA12 }}" GDM_API_TOKEN="${{ secrets.TOKEN_GRA }}" GDM_INCLUDE="gra" yarn start